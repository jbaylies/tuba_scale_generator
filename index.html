  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Tuba Scale Generator",
    "url": "https://scale.sousastep.quest/",
    "description": "Interactive scale generator for tuba, euphonium and sousaphone players. Practice scales with fingerings, printable sheet music, and audio playback.",
    "applicationCategory": "Education",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "about": {
      "@type": "Thing",
      "name": "Brass Instrument Scales & Fingerings",
      "description": "Major, minor, blues, pentatonic, bebop and 80+ scale types for BBb, CC, Eb, F, and GG tubas with euphonium and trumpet transposition"
    },
    "audience": {
      "@type": "EducationalAudience",
      "educationalRole": "Student"
    },
    "featureList": [
      "Scale notation with key signatures",
      "Tuba fingerings for BBb, CC, Eb, F, GG tubas",
      "Treble clef transposition for euphonium and trumpet",
      "80+ scale types including modes, jazz, pentatonic, and world scales",
      "Practice patterns including intervals, diatonic triads, 7ths, 9ths, and Clarke studies",
      "Audio playback with adjustable tempo",
      "Printable sheet music",
      "MusicXML export"
    ]
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>Tuba Scale Generator</h1>
      <p class="subtitle">Pick a key and mode, choose your range, and see the scale notated for tuba!</p>
    </header>

    <section class="controls" aria-label="Scale controls">
      <div class="control">
        <div class="label-row">
          <label for="keySelect">Key</label>
          <button class="shuffle-btn" id="shuffleKeyBtn" type="button" title="Randomize key" aria-label="Randomize key">🎲</button>
        </div>
        <div class="select-wrap">
          <select id="keySelect"></select>
          <span class="select-caret" aria-hidden="true">▾</span>
        </div>
      </div>

      <div class="control control-type">
        <label for="typeSelect">Type</label>
        <div class="select-wrap">
          <select id="typeSelect"></select>
          <span class="select-caret" aria-hidden="true">▾</span>
        </div>
      </div>

      <div class="control">
        <div class="label-row">
          <label for="modeSelect" id="modeLabel">Mode</label>
          <button class="shuffle-btn" id="shuffleModeBtn" type="button" title="Randomize mode" aria-label="Randomize mode">🎲</button>
        </div>
        <div class="select-wrap">
          <select id="modeSelect"></select>
          <span class="select-caret" aria-hidden="true">▾</span>
        </div>
      </div>

      <div class="control control-narrow octave-control">
        <label for="lowestNoteSelect">Lowest Note</label>
        <div class="select-wrap">
          <select id="lowestNoteSelect"></select>
          <span class="select-caret" aria-hidden="true">▾</span>
        </div>
      </div>

      <div class="control control-narrow octave-control">
        <label for="numOctavesSelect">Octaves</label>
        <div class="select-wrap">
          <select id="numOctavesSelect"></select>
          <span class="select-caret" aria-hidden="true">▾</span>
        </div>
      </div>

      <button id="playBtn" class="play-btn play-btn-mobile" type="button" aria-label="Play scale">
        <span class="play-icon" aria-hidden="true">▶</span>
        <span class="play-label">Play</span>
      </button>

      <button id="settingsToggle" class="settings-toggle" type="button" aria-expanded="false" aria-label="Toggle advanced settings">
        <span class="settings-icon" aria-hidden="true">⚙️</span>
        <span class="settings-label">Settings</span>
        <span class="settings-caret" aria-hidden="true">▾</span>
      </button>

      <div id="advancedControls" class="advanced-controls collapsed">
        <div class="control control-narrow octave-control-mobile">
          <label for="lowestNoteSelectMobile">Lowest Note</label>
          <div class="select-wrap">
            <select id="lowestNoteSelectMobile"></select>
            <span class="select-caret" aria-hidden="true">▾</span>
          </div>
        </div>

        <div class="control control-narrow octave-control-mobile">
          <label for="numOctavesSelectMobile">Octaves</label>
          <div class="select-wrap">
            <select id="numOctavesSelectMobile"></select>
            <span class="select-caret" aria-hidden="true">▾</span>
          </div>
        </div>

        <div class="control control-narrow">
          <label for="tubaSelect">Tuba</label>
          <div class="select-wrap">
            <select id="tubaSelect"></select>
            <span class="select-caret" aria-hidden="true">▾</span>
          </div>
        </div>

        <div class="control">
          <div class="label-row">
            <label for="patternSelect">Pattern</label>
            <button class="shuffle-btn" id="shufflePatternBtn" type="button" title="Randomize pattern" aria-label="Randomize pattern">🎲</button>
          </div>
          <div class="select-wrap">
            <select id="patternSelect"></select>
            <span class="select-caret" aria-hidden="true">▾</span>
          </div>
        </div>

        <div class="control control-narrow">
          <label for="directionSelect">Direction</label>
          <div class="select-wrap">
            <select id="directionSelect"></select>
            <span class="select-caret" aria-hidden="true">▾</span>
          </div>
        </div>

        <div class="control control-toggle">
          <label for="keySigToggle">Key Signature</label>
          <label class="switch">
            <input type="checkbox" id="keySigToggle" checked />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="control control-toggle">
          <label for="fingeringToggle">Fingerings</label>
          <label class="switch">
            <input type="checkbox" id="fingeringToggle" checked />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="control control-toggle">
          <label for="noteNameToggle">Note Names</label>
          <label class="switch">
            <input type="checkbox" id="noteNameToggle" checked />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="control control-toggle">
          <label for="degreeToggle">Degrees</label>
          <label class="switch">
            <input type="checkbox" id="degreeToggle" />
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <div class="control control-bpm">
          <label for="bpmSlider">Tempo: <span id="bpmValue">240</span> BPM</label>
          <div class="bpm-row">
            <input type="range" id="bpmSlider" min="30" max="999" value="240" step="1" />
            <button id="playBtnDesktop" class="play-btn play-btn-desktop" type="button" aria-label="Play scale">
              <span class="play-icon" aria-hidden="true">▶</span>
              <span class="play-label">Play</span>
            </button>
          </div>
        </div>

        <button id="printBtn" class="print-btn print-btn-settings" type="button" aria-label="Print sheet music">
          <span class="print-icon" aria-hidden="true">🖨</span>
          <span class="print-label">Print</span>
        </button>

        <button id="musicXmlBtn" class="musicxml-btn" type="button" aria-label="Export MusicXML">
          <span class="musicxml-icon" aria-hidden="true">🎼</span>
          <span class="musicxml-label">MusicXML</span>
        </button>
      </div>
    </section>

    <section class="info-bar" aria-live="polite">
      <span id="scaleName" class="info-chip">—</span>
      <span id="noteCount" class="info-chip muted">— notes</span>
      <span id="keySigIndicator" class="info-chip info-chip-keysig" title="Whether this scale has a clean key signature">
        <span class="keysig-dot"></span>
        <span class="keysig-label">—</span>
      </span>
    </section>

    <section class="notation" aria-label="Scale notation">
      <h2 class="sr-only">Scale Notation &amp; Fingerings</h2>
      <div id="vexflow-output"></div>
      <div id="vexflow-output-print"></div>
    </section>

    <div id="notationHint" class="note-names hidden" aria-live="polite"></div>

    <footer class="foot">
      <span>Powered by <a href="https://github.com/tonaljs/tonal" target="_blank" rel="noopener"><strong>Tonal.js</strong></a>, <a href="https://www.vexflow.com/" target="_blank" rel="noopener"><strong>VexFlow</strong></a>, &amp; <a href="https://github.com/jbaylies/tuba_scale_generator/tree/gh-pages" target="_blank" rel="noopener"><strong>GitHub</strong></a><br> Vibecoded with <a href="https://freebuff.com/" target="_blank" rel="noopener"><strong>freebuff</strong></a> by <a href="https://www.sousastep.quest/" target="_blank" rel="noopener"><strong>sousastep</strong></a></span>
    </footer>
  </div>

  <!-- Libraries via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tonal@6.4.3/browser/tonal.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js"></script>
  <script src="app.js"></script>
</body>
</html>
